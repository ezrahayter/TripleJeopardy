# Minimal local config for `supabase start` / `supabase db push`.
# Run `supabase init` if you want the full generated file; this is enough to link.
project_id = "triple-jeopardy"

[db]
major_version = 15

# All three functions verify the caller themselves (or are called by Meta), so
# skip Supabase's built-in JWT gate.
[functions.connect-bluesky]
verify_jwt = false

[functions.oauth-start]
verify_jwt = false

[functions.oauth-callback]
verify_jwt = false

[functions.connect-assign]
verify_jwt = false

[functions.notify-candidate]
verify_jwt = false

[functions.run-nudges]
verify_jwt = false

[functions.og-fetch]
verify_jwt = false

[functions.ai]
verify_jwt = false

[functions.calendar-feed]
verify_jwt = false

[functions.review]
verify_jwt = false
